<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="googlebot" content="noindex, nofollow">
  <meta name="yandex" content="none">
  <meta name="theme-color" content="#FFFDF2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Трекер">
  <title>Трекер</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./icons/favicon.svg">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <!-- Lock Screen (shown before local AES-256-GCM decryption) -->
  <main id="lock-screen" class="lock-screen" aria-label="Вход по паролю">
    <div class="lock-card comic-card">
      <div class="lock-sticker" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="44" height="44" fill="none">
          <rect x="14" y="28" width="36" height="26" rx="8" fill="#FACC15" stroke="#18181B" stroke-width="3.5"/>
          <path d="M22 28V20C22 14.477 26.477 10 32 10C37.523 10 42 14.477 42 20V28" stroke="#18181B" stroke-width="3.5" stroke-linecap="round"/>
          <circle cx="32" cy="40" r="3.8" fill="#18181B"/>
          <path d="M32 43V47" stroke="#18181B" stroke-width="3" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="pill pill-yellow lock-pill">Приватный вход</div>
      <h1 class="lock-title">Секретный ключик</h1>
      <p class="lock-subtitle">
        Всё зашифровано локально. Введи наш пароль, чтобы открыть трекер и воспоминания.
      </p>

      <form id="unlock-form" class="unlock-form" autocomplete="off">
        <label class="sr-only" for="password-input">Пароль</label>
        <div class="password-field">
          <input
            id="password-input"
            type="password"
            placeholder="Введи пароль..."
            autocomplete="current-password"
            enterkeyhint="go"
            required
          >
          <button
            type="button"
            id="toggle-pass-btn"
            class="icon-btn-inline"
            aria-label="Показать или скрыть пароль"
            title="Показать пароль"
          >
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>

        <label class="remember-row">
          <input type="checkbox" id="remember-checkbox" checked>
          <span>Запомнить на этом телефоне</span>
        </label>

        <button type="submit" id="unlock-btn" class="comic-btn comic-btn-primary">
          <span class="btn-label">Открыть!</span>
        </button>

        <p id="lock-error" class="lock-error" role="alert" hidden></p>
      </form>

      <div class="lock-footnote">
        <span class="dot-secure" aria-hidden="true"></span>
        <span>AES-256-GCM · расшифровка только в браузере</span>
      </div>
    </div>
  </main>

  <!-- Main App Shell (populated only after successful decryption) -->
  <div id="app-shell" class="app-shell" hidden>
    <header class="app-header">
      <div class="header-inner">
        <div class="brand-block">
          <div class="brand-badge" aria-hidden="true">★</div>
          <div class="brand-text">
            <h1 id="app-title" class="brand-title">Трекер</h1>
          </div>
        </div>
        <button type="button" id="lock-btn" class="comic-icon-btn" aria-label="Заблокировать" title="Заблокировать">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="11" width="16" height="10" rx="3"/>
            <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
          </svg>
        </button>
      </div>
    </header>

    <main class="app-main">
      <!-- TAB 1: ПУТЬ -->
      <section id="tab-path" class="tab-panel" aria-label="Путь">
        <div id="path-content" class="stack"></div>
      </section>

      <!-- TAB 2: ВОСПОМИНАНИЯ -->
      <section id="tab-memories" class="tab-panel" aria-label="Воспоминания" hidden>
        <div id="memories-content" class="stack"></div>
      </section>
    </main>

    <!-- Thumb-friendly Bottom Navigation -->
    <nav class="bottom-nav" aria-label="Разделы">
      <div class="bottom-nav-inner">
        <button type="button" class="nav-btn is-active" data-tab="path" aria-current="page">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 19c4-1 4-6 8-7s4-6 8-7"/>
              <circle cx="5" cy="19" r="2.2" fill="currentColor"/>
              <circle cx="19" cy="5" r="2.2" fill="currentColor"/>
            </svg>
          </span>
          <span class="nav-label">Путь</span>
        </button>

        <button type="button" class="nav-btn" data-tab="memories">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="5" width="18" height="14" rx="3"/>
              <circle cx="9" cy="10.5" r="1.6"/>
              <path d="M21 15.5l-4.5-4.5-6.5 6.5"/>
            </svg>
          </span>
          <span class="nav-label">Воспоминания</span>
          <span id="memories-count-badge" class="nav-badge" hidden>0</span>
        </button>
      </div>
    </nav>
  </div>

  <!-- Full-Screen Photo Lightbox -->
  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Просмотр фото" hidden>
    <div class="lightbox-backdrop" id="lightbox-backdrop"></div>
    <div class="lightbox-chrome">
      <div class="lightbox-counter" id="lightbox-counter">1 / 1</div>
      <button type="button" id="lightbox-close" class="lightbox-btn" aria-label="Закрыть">✕</button>
    </div>
    <div class="lightbox-stage" id="lightbox-stage">
      <button type="button" id="lightbox-prev" class="lightbox-nav lightbox-prev" aria-label="Предыдущее фото">‹</button>
      <img id="lightbox-img" class="lightbox-img" alt="">
      <button type="button" id="lightbox-next" class="lightbox-nav lightbox-next" aria-label="Следующее фото">›</button>
    </div>
    <div class="lightbox-footer">
      <p id="lightbox-caption" class="lightbox-caption"></p>
      <p id="lightbox-meta" class="lightbox-meta"></p>
    </div>
  </div>

  <script src="./app.js" defer></script>
</body>
</html>
